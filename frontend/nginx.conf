server {
    listen 80;
    # Имя хоста/домена. _ — заглушка «любой хост»: nginx будет отвечать независимо от того, по какому Host пришёл запрос (на случай обращения по IP или произвольному имени).
    server_name _;
	# Корневая директория для статики. Сюда Dockerfile копирует собранный Vite-ом dist/ — отсюда nginx отдаёт index.html, JS, CSS.
    root /usr/share/nginx/html;
    # Файл по умолчанию при обращении к каталогу (например, запрос / отдаст /usr/share/nginx/html/index.html).
    index index.html;
	# Максимальный размер тела запроса, который nginx примет от клиента. По умолчанию всего 1 МБ — при загрузке фото через /api/upload это давало бы 413 Request Entity Too Large, поэтому лимит поднят до 25 МБ.
    client_max_body_size 25m;              # загрузка фото
	# Правило для всех путей, начинающихся с /api/ (весь backend: /api/auth/..., /api/photos/...). Это префиксный location.
    location /api/ {
    	# Передать запрос на backend-контейнер по имени сервиса backend, порт 8082.
        proxy_pass http://backend:8082;    # без слэша: context-path /api сохраняется
        # Пробросить в backend исходный заголовок Host от клиента (а не backend:8082). Полезно для корректного формирования ссылок/логирования.
        proxy_set_header Host $host;
        # Кладёт в заголовок X-Real-IP реальный IP клиента, который видит nginx (иначе backend видел бы только IP nginx-контейнера).
        proxy_set_header X-Real-IP $remote_addr;
        # Передаёт цепочку IP клиентов (добавляет $remote_addr к уже существующему заголовку). Стандарт для прокси, чтобы backend видел настоящего клиента.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

	# Правило для всего остального (все прочие пути) — здесь весит само SPA.
    location / {
   		# Пытаться отдать файл по пути ($uri), затем каталог ($uri/), а если ничего нет — вернуть /index.html. Это «history fallback» для Vue Router (createWebHistory): при прямом заходе по маршруту вроде /photos или /upload на диске такого файла нет, поэтому отдаётся index.html, и уже клиентский роутер разбирает URL.
        try_files $uri $uri/ /index.html;  # SPA history fallback
    }
}
