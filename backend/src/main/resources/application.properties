spring.application.name=photogram
logging.level.root=DEBUG
server.port=8082

# application.properties читает переменные окружения контейнера. Плейсхолдеры
# ${MYSQL_USER}, ${S3_ACCESS_KEY}, ${JWT_SECRET} резолвятся из env-переменных
# запущенного процесса backend, а не из .env.

# JWT (симметричный секрет, HS256). Секрет обязателен и должен быть длиной >= 32 байт.
# Дефолта нет намеренно: без JWT_SECRET приложение не стартует, чтобы секрет
# нельзя было случайно оставить публичным. Сгенерировать: openssl rand -base64 48
app.jwt.secret=${JWT_SECRET}
app.jwt.ttl-minutes=1440

# Все запросы идут через /api (context-path)
server.servlet.context-path=/api

# Настройки подключения к БД в Docker
spring.datasource.url=jdbc:mariadb://localhost:3306/${MYSQL_DATABASE}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Настройки JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# REST
# Data REST отключён (exported=false у репозиториев), basePath не нужен:
# при server.servlet.context-path=/api путь /api сюда добавлять НЕ надо,
# иначе получится /api/api/...
# spring.data.rest.basePath=/api

# S3 / Garage Settings
aws.s3.endpoint=http://localhost:3900
aws.s3.region=garage
# aws.region=garage
aws.s3.access-key=${S3_ACCESS_KEY}
aws.s3.secret-key=${S3_SECRET_KEY}
aws.s3.bucket-name=${S3_BUCKET_NAME}
